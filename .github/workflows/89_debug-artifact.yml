name: 89 debug artifact

# Разовая диагностика. Два режима:
#   - без входных данных: проверить, сохраняет ли cp -fpR права каталога;
#   - с run_id: распаковать образ прогона и показать права на /myscripts.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID прогона с артефактом sdcard-*; пусто — только тест cp"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  cp-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: cp -fpR semantics
        run: |
          set -eu
          rm -rf t && mkdir -p t/src/myscripts t/dst
          printf '#!/bin/sh\necho hi\n' > t/src/myscripts/a.sh
          chmod 0777 t/src/myscripts t/src/myscripts/a.sh
          cp -fpR t/src/. t/dst
          echo "нет каталога в приёмнике:"
          stat -c '%a %n' t/dst/myscripts t/dst/myscripts/a.sh
          rm -rf t/dst2 && mkdir -p t/dst2/myscripts && chmod 0755 t/dst2/myscripts
          cp -fpR t/src/. t/dst2
          echo "каталог в приёмнике уже есть (0755):"
          stat -c '%a %n' t/dst2/myscripts t/dst2/myscripts/a.sh

  inspect:
    if: ${{ inputs.run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p art
          gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" \
            --pattern 'sdcard-*' --dir art
          find art -type f -maxdepth 3 | head -20

      - name: Inspect modes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends squashfs-tools fdisk
          img="$(find art -name '*.img.gz' | head -1)"
          gzip -dc "$img" > disk.img
          off="$(sfdisk -d disk.img | sed -n 's/.*start= *\([0-9]*\).*type= *83.*/\1/p' | head -1)"
          echo "rootfs offset sectors: $off"
          unsquashfs -ll -o $((off * 512)) disk.img > listing.txt 2>/dev/null
          echo "== строки myscripts =="
          grep -E 'myscripts|run-diag' listing.txt || echo "нет строк"
          echo "== начало листинга =="
          head -5 listing.txt
          echo "== права init-скриптов для сравнения =="
          grep -E 'etc/init.d/(fmradio|audiosrc)$' listing.txt || true
