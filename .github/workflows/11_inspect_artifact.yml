name: 11 inspect artifact

# Разовая инспекция готового образа из указанного прогона: показать права
# на /myscripts и состав rootfs. Запускается вручную, в конвейер не входит.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID прогона с артефактом sdcard-*"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 1.1 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 1.2 Download image artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p art
          gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" \
            --pattern 'sdcard-*' --dir art
          find art -type f -maxdepth 3 | head -20

      - name: 1.3 Inspect modes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends squashfs-tools fdisk
          img="$(find art -name '*.img.gz' | head -1)"
          gzip -dc "$img" > disk.img
          off="$(sfdisk -d disk.img | sed -n 's/.*start= *\([0-9]*\).*type= *83.*/\1/p' | head -1)"
          echo "rootfs offset sectors: $off"
          unsquashfs -ll -o $((off * 512)) disk.img > listing.txt 2>/dev/null
          echo "== myscripts lines =="
          grep -E 'myscripts|run-diag' listing.txt || echo "no lines"
          echo "== listing head =="
          head -5 listing.txt
          echo "== init script modes for comparison =="
          grep -E 'etc/init.d/(fmradio|audiosrc)$' listing.txt || true
