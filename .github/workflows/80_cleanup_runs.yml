name: 80 cleanup runs

# Чистит историю прогонов Actions, чтобы она не росла бесконечно.
#
# Правила, которые workflow соблюдает всегда (W-37, W-38):
#   - удаляются только завершённые прогоны (status = completed);
#   - срок хранения зависит от итога: успешные — `success_days` (по умолчанию 10),
#     упавшие и отменённые — `failed_days` (по умолчанию 15);
#   - по одному последнему прогону каждого итога на каждый workflow сохраняется
#     при любом сроке: это точка отсчёта, а не мусор;
#   - текущий прогон не удаляется никогда (исключён по id);
#   - сроки задаются входами и проверяются на целое число.
#
# Удаление прогона удаляет и его артефакты. Артефакты промежуточных сборок
# удаляются отдельно по W-39: см. logs/README.md в проекте.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      workflow:
        description: "Файл workflow (all = все workflow репозитория)"
        required: false
        default: "all"
      success_days:
        description: "Удалять успешные прогоны старше N дней"
        required: false
        default: "10"
      failed_days:
        description: "Удалять упавшие и отменённые прогоны старше N дней"
        required: false
        default: "15"
      dry_run:
        description: "true = только показать, ничего не удалять"
        required: false
        default: "false"

permissions:
  actions: write   # gh run delete
  contents: read

concurrency:
  group: cleanup-runs
  cancel-in-progress: false

env:
  # для schedule-запуска inputs пусты — берём значения по умолчанию
  TARGET_WORKFLOW: ${{ inputs.workflow || 'all' }}
  SUCCESS_DAYS: ${{ inputs.success_days || '10' }}
  FAILED_DAYS: ${{ inputs.failed_days || '15' }}
  DRY_RUN: ${{ inputs.dry_run || 'false' }}
  # сколько последних прогонов просматривать за один запуск; если история
  # длиннее, хвост дочистится следующими запусками
  LIST_LIMIT: "1000"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 1.1 Validate inputs
        run: |
          for pair in "success_days:$SUCCESS_DAYS" "failed_days:$FAILED_DAYS"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            case "$value" in
              ''|*[!0-9]*)
                echo "ERROR: $name must be an integer" >&2
                exit 1
                ;;
            esac
            if [ "$value" -lt 1 ]; then
              echo "ERROR: $name must be at least 1" >&2
              exit 1
            fi
          done
          case "$DRY_RUN" in
            true|false) ;;
            *)
              echo "ERROR: dry_run accepts only true or false" >&2
              exit 1
              ;;
          esac
          echo "workflow      : $TARGET_WORKFLOW"
          echo "successful    : older than $SUCCESS_DAYS days"
          echo "failed        : older than $FAILED_DAYS days"
          echo "dry run       : $DRY_RUN"

      - name: 1.2 Delete old completed runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          success_cutoff="$(date -u -d "-${SUCCESS_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          failed_cutoff="$(date -u -d "-${FAILED_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          echo "success cutoff: $success_cutoff"
          echo "failed cutoff : $failed_cutoff"

          wf_args=()
          if [ "$TARGET_WORKFLOW" != "all" ]; then
            wf_args=(--workflow "$TARGET_WORKFLOW")
          fi

          # --repo обязателен: у репозитория два remote (origin — наш форк,
          # upstream — автор), и gh без него может уйти не в тот репозиторий
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" "${wf_args[@]}" \
                    --status completed --limit "$LIST_LIMIT" \
                    --json databaseId,conclusion,status,createdAt,workflowName,displayTitle)"
          total="$(jq 'length' <<<"$runs")"
          echo "completed runs scanned: $total (limit $LIST_LIMIT)"

          # $keep — по одному последнему прогону каждого итога на workflow.
          # Такие прогоны не удаляются при любом сроке (W-37).
          old="$(jq -r \
                    --arg self "$GITHUB_RUN_ID" \
                    --arg scut "$success_cutoff" \
                    --arg fcut "$failed_cutoff" '
            [ .[] | select(.status == "completed") ] as $all
            | ( $all
                | group_by(.workflowName)
                | map( { key: .[0].workflowName,
                        value: ( group_by(.conclusion)
                                 | map(max_by(.createdAt) | .databaseId) ) } )
                | from_entries ) as $keep
            | $all[]
            | . as $r
            | select( ($keep[$r.workflowName] | index($r.databaseId)) == null )
            | select( ($r.databaseId | tostring) != $self )
            | select( ($r.conclusion == "success" and $r.createdAt < $scut)
                      or ($r.conclusion != "success" and $r.createdAt < $fcut) )
            | [$r.databaseId, $r.createdAt, $r.workflowName, $r.conclusion, $r.displayTitle]
            | @tsv' <<<"$runs")"
          count="$(printf '%s' "$old" | grep -c . || true)"
          echo "to delete: $count"

          deleted=0
          while IFS=$'\t' read -r id created wf conclusion title; do
            [ -n "${id:-}" ] || continue
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY-RUN  $id  $created  [$wf] $conclusion  $title"
              continue
            fi
            gh run delete "$id" --repo "$GITHUB_REPOSITORY"
            echo "deleted  $id  $created  [$wf] $conclusion  $title"
            deleted=$((deleted + 1))
          done <<<"$old"

          {
            echo "### Actions run cleanup"
            echo
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| workflow | \`$TARGET_WORKFLOW\` |"
            echo "| successful older than | $SUCCESS_DAYS days (cutoff $success_cutoff) |"
            echo "| failed older than | $FAILED_DAYS days (cutoff $failed_cutoff) |"
            echo "| completed runs scanned | $total |"
            echo "| to delete | $count |"
            echo "| deleted | $deleted |"
            echo "| dry run | $DRY_RUN |"
          } >> "$GITHUB_STEP_SUMMARY"
