name: 01 build image

# Единый конвейер: 01 lint → 02 build → 03 qemu smoke → 04 release.
# Каждая джоба — шаг конвейера, сбои видны по номеру в списке прогона.
#
# Ветки main — сборка образа. Тег v* — только публикация релиза: образ берётся
# из уже зелёного прогона для коммита тега, пересборки нет.
on:
  workflow_dispatch:
    inputs:
      # — шаги 01–03: сборка —
      openwrt_tag:
        description: "Тег OpenWrt (пусто = значение из .openwrt-version)"
        required: false
        default: ""
      package:
        description: "Собрать только пакет (например package/boot/uboot-zynq); пусто = весь образ"
        required: false
        default: ""
      jobs:
        description: "Параллельность make (пусто = min(nproc,4))"
        required: false
        default: ""
      # — шаг 04: релиз —
      tag:
        description: "Шаг 04: тег релиза (например v1.1.0); пусто = тег из push"
        required: false
        default: ""
      release_run_id:
        description: "Шаг 04: ID зелёного прогона (пусто = найти по коммиту тега)"
        required: false
        default: ""
      overwrite:
        description: "Шаг 04: обновить существующий релиз (перезалить файл и описание)"
        type: boolean
        default: false
  push:
    # пути фильтруют только push в ветку; для тегов фильтр путей не применяется
    branches: [main]
    paths:
      - "packages/**"
      - "target-patches/**"
      - "configs/**"
      - "files/**"
      - "bootloader/**"
      - "bitstream/**"
      - "scripts/**"
      - ".github/workflows/01_build.yml"
    tags: ["v*"]

concurrency:
  # На main идущую сборку не отменяем: она длится ~1,5 ч и содержит артефакт
  # образа; новая постановка встанет в очередь. На ветках отмена безопасна.
  # Прогон по тегу не отменяем никогда: это публикация релиза.
  group: build-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  actions: read   # gh run download артефакта своего же прогона (шаг 03)

# ─────────────────────────────────────────────────────────────────────
# КОНСТАНТЫ СБОРКИ
# Меняются при переходе на другую цель или другое устройство.
# Версия OpenWrt здесь НЕ задаётся: единственный источник — .openwrt-version.
# ─────────────────────────────────────────────────────────────────────
env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_DIR: openwrt
  TARGET: zynq
  SUBTARGET: generic
  ARTIFACT_PREFIX: sdcard
  DEFAULT_JOBS: "4"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
# ─────────────────────────────────────────────────────────────────────

jobs:
  # Шаг 01 конвейера: быстрые проверки того, что мы вообще запускаем, — YAML
  # workflow и shell-скрипты. Сборка начинается только после успеха линта:
  # минута проверки не пускает 90-минутную сборку с заведомо битым входом.
  lint:
    name: 01 lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version
          shellcheck -S warning scripts/*.sh

      - name: actionlint
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/actionlint.tgz "$url"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color

  # Шаг 02: сборка образа. Выполняется на каждом прогоне ветки main.
  build:
    name: 02 build
    needs: lint
    # Сборка — только для веток. Прогон по тегу приходит ради шага 04,
    # а ручной запуск с входом релиза (tag/release_run_id) — тоже без сборки.
    if: ${{ github.ref_type != 'tag' && inputs.release_run_id == '' && inputs.tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve OpenWrt tag
        id: tag
        run: |
          tag="${{ inputs.openwrt_tag }}"
          if [ -z "$tag" ]; then
            tag="$(tr -d '[:space:]' < .openwrt-version 2>/dev/null || true)"
          fi
          if [ -z "$tag" ]; then
            echo "ОШИБКА: .openwrt-version пуст и тег не передан вручную" >&2
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "OpenWrt: $tag"

      - name: Resolve build parallelism
        id: jobs
        run: |
          jobs="${{ inputs.jobs }}"
          if [ -z "$jobs" ]; then
            jobs="$DEFAULT_JOBS"
            ncpu="$(nproc)"
            if [ "$ncpu" -lt "$jobs" ]; then
              jobs="$ncpu"
            fi
          fi
          echo "value=$jobs" >> "$GITHUB_OUTPUT"
          echo "параллельность make: $jobs (nproc $(nproc))"

      - name: Show build constants
        run: |
          echo "репозиторий : $OPENWRT_REPO"
          echo "каталог     : $OPENWRT_DIR"
          echo "цель        : $TARGET/$SUBTARGET"
          echo "тег         : ${{ steps.tag.outputs.value }}"
          echo "jobs        : ${{ steps.jobs.outputs.value }}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h / | tail -1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file libelf-dev wget ca-certificates ccache \
            squashfs-tools mtools dosfstools fdisk device-tree-compiler u-boot-tools

      # Ловит битый коммит, порчу переводов строк и подмену двоичных файлов
      # до 90-минутной сборки.
      - name: Verify input artifacts
        run: |
          sha256sum -c scripts/expected-artifacts.sha256
          gzip -t bitstream/system.bit.gz
          # `|| true`: head закрывает поток раньше gzip, а GitHub включает pipefail
          magic="$(gzip -dc bitstream/system.bit.gz 2>/dev/null | head -c 4 | od -An -tx1 | tr -d ' \n' || true)"
          if [ "$magic" != "00090ff0" ]; then
            echo "ОШИБКА: магия битстрима $magic, ожидалась 00090ff0" >&2
            exit 1
          fi
          echo "входные артефакты в порядке"

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 -b "${{ steps.tag.outputs.value }}" \
            "$OPENWRT_REPO" "$OPENWRT_DIR"

      - name: Apply patches and configure
        run: bash scripts/apply.sh "./$OPENWRT_DIR"

      # Патчи могли лечь частично: сверяем, что затронуты ожидаемые файлы.
      - name: Audit patch layer
        run: |
          cd "$OPENWRT_DIR"
          git diff --stat
          failed=0
          # Патч может изменить существующий файл или добавить новый.
          # Новые файлы git apply кладёт как untracked — git diff их не показывает,
          # поэтому проверяем оба случая.
          check_patched() {
            if [ -f "$1" ] && ! git ls-files --error-unmatch -- "$1" >/dev/null 2>&1; then
              echo "ok  $1 (новый файл из патча)"
            elif [ -f "$1" ] && ! git diff --quiet -- "$1"; then
              echo "ok  $1 (изменён патчем)"
            else
              echo "ОШИБКА: патч не изменил $1" >&2
              failed=1
            fi
          }
          check_patched target/linux/zynq/image/Makefile
          check_patched target/linux/zynq/base-files/etc/board.d/02_network
          check_patched target/linux/zynq/patches/0001-dts-add-antminer-s9.patch
          check_patched target/linux/zynq/patches/0002-dts-antminer-s9-led-aliases.patch

          # Файлы, которые создают или меняют наши патчи 0300–0600.
          # check_patched ловит «патч не лёг», check_content — «лёг, но не то».
          check_patched target/linux/zynq/patches/0003-dts-antminer-s9-pl.patch
          check_patched target/linux/zynq/patches/0004-dts-antminer-s9-nand.patch
          check_patched target/linux/zynq/Makefile
          # Имя конфига ядра зависит от версии: config-6.12, config-6.18 и т. д.
          kconf="$(ls target/linux/zynq/config-6.* 2>/dev/null | tail -1 || true)"
          if [ -z "$kconf" ]; then
            echo "ОШИБКА: в target/linux/zynq нет config-6.*" >&2
            failed=1
          else
            check_patched "$kconf"
          fi
          check_content() {
            if grep -q "$2" "$1"; then
              echo "ok  $1 содержит '$2'"
            else
              echo "ОШИБКА: в $1 нет '$2'" >&2
              failed=1
            fi
          }
          check_content target/linux/zynq/patches/0003-dts-antminer-s9-pl.patch "fm-radio@43c60000"
          check_content target/linux/zynq/patches/0004-dts-antminer-s9-nand.patch 'label = "uboot_env"'
          if [ -n "$kconf" ]; then
            check_content "$kconf" "CONFIG_SOUND=y"
            check_content "$kconf" "CONFIG_SND_SOC_ADI_AXI_I2S"
            check_content "$kconf" "CONFIG_MTD_RAW_NAND=y"
            check_content "$kconf" "CONFIG_MTD_NAND_PL35X=y"
          fi
          check_content target/linux/zynq/Makefile "nand"

          git status --short > "$GITHUB_WORKSPACE/patch-status.txt"
          exit $failed

      # `make defconfig` молча выбрасывает неразрешившиеся символы: без этой
      # проверки образ собирается без нужных пакетов и CI остаётся зелёным.
      - name: Verify config
        run: bash scripts/check_config.sh "./$OPENWRT_DIR" configs/zynq_antminer_s9.config

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # тот же каталог, что и CCACHE_DIR ниже: раньше кэш сохранялся из
          # ~/.ccache, а сборка писала в $GITHUB_WORKSPACE/.ccache — кэш не работал
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ steps.tag.outputs.value }}-${{ hashFiles('configs/**', 'target-patches/**', 'packages/**') }}
          restore-keys: |
            ccache-${{ steps.tag.outputs.value }}-

      - name: Download sources
        timeout-minutes: 90
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cd "$OPENWRT_DIR"
          ok=0
          for attempt in 1 2 3; do
            if make -j"${{ steps.jobs.outputs.value }}" download; then
              ok=1
              break
            fi
            echo "===== попытка $attempt не удалась, пауза 20 с =====" >&2
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "ОШИБКА: не удалось скачать исходники за три попытки" >&2
            exit 1
          fi

      - name: Build
        timeout-minutes: 300
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cd "$OPENWRT_DIR"
          JOBS="${{ steps.jobs.outputs.value }}"
          if [ -n "${{ inputs.package }}" ]; then
            echo "сборка только пакета: ${{ inputs.package }}"
            # адресная сборка не тянет за собой host-инструменты и тулчейн
            make -j"$JOBS" tools/install
            make -j"$JOBS" toolchain/install
            make -j"$JOBS" "${{ inputs.package }}/compile" V=s
            exit $?
          fi

          set +e
          # -k: продолжаем после ошибки, чтобы увидеть ВСЕ сломанные пакеты
          # за один прогон, а не по одному на цикл в полтора часа.
          make -j"$JOBS" -k world > "$GITHUB_WORKSPACE/build.log" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "===== сборка упала, ищу пакет ====="
            grep -E "ERROR: .* failed to build|make(\[[0-9]+\])?: \*\*\*" "$GITHUB_WORKSPACE/build.log" | tail -40

            # Повтор упавшей цели с V=s: verbose.mk в обычном режиме глушит
            # вывод вложенных make, поэтому без повтора в логе только
            # «build failed». Вывод пишем в retry.log: он уходит в артефакт,
            # и ошибку видно, даже если она не попала в tail.
            retry_target() {
              local log="$GITHUB_WORKSPACE/retry.log"
              echo "===== повтор $* с V=s =====" | tee -a "$log"
              make -j1 "$@" V=s >> "$log" 2>&1
              local rc=$?
              echo "код возврата повтора: $rc" | tee -a "$log"
              echo "===== ошибки в повторе ====="
              grep -nE "Error [0-9]+|error:|ERROR:|No rule|No space left|Killed|command not found|Permission denied|missing" "$log" | tail -60
              echo "===== последние 200 строк повтора ====="
              tail -n 200 "$log"
              return $rc
            }

            mapfile -t failed < <(grep -oE "ERROR: [^ ]+ failed to build" "$GITHUB_WORKSPACE/build.log" \
                                  | awk '{print $2}' | sort -u)
            if [ "${#failed[@]}" -gt 0 ]; then
              echo "===== сломанных целей: ${#failed[@]} ====="
              printf '  - %s\n' "${failed[@]}"
              case "${failed[0]}" in
                target/*)
                  # 1. Диагностика. В world verbose.mk глушит текст ошибки,
                  #    поэтому сначала повторяем именно фазу компиляции с V=s:
                  #    если ошибка детерминированная, она будет видна здесь.
                  if retry_target "${failed[0]}/compile"; then
                    # 2. Достраиваем установки. После падения на фазе compile
                    #    стадии tools/install и toolchain/install не выполнялись:
                    #    в staging_dir/host/bin нет apk, и package/install
                    #    падает с «apk: No such file or directory».
                    #    target/install тянет compile за собой, а package/install
                    #    создаёт rootfs-каталог, без которого mksquashfs падает
                    #    с «Cannot stat root-zynq». Порядок обязателен.
                    make -j"$JOBS" tools/install toolchain/install >> "$GITHUB_WORKSPACE/retry.log" 2>&1 || true
                    ls -l "$OPENWRT_DIR/staging_dir/host/bin/apk" 2>&1 || true
                    retry_target package/install target/install
                  else
                    echo "детерминированная ошибка компиляции — установки пропущены"
                  fi
                  ;;
                *)
                  retry_target "${failed[0]}/compile"
                  ;;
              esac
            else
              # verbose.mk в обычном режиме отправляет stderr вложенных make
              # в /dev/null и оставляет только «build failed» — реальной ошибки
              # в build.log нет вовсе. Поэтому повторяем именно упавшую цель
              # (из последней строки « make[N] <цель>») с V=s.
              echo "===== пакет не назван: ошибки в build.log ====="
              grep -nE "Error [0-9]+|error:|ERROR:|No space left|Killed|command not found" \
                "$GITHUB_WORKSPACE/build.log" | tail -40
              echo "===== последние 60 строк build.log ====="
              tail -n 60 "$GITHUB_WORKSPACE/build.log"

              # «-C» — это не цель, а флаг make; такие строки отбрасываем.
              failed_target="$(grep -oE '^ make\[[0-9]+\] [^ ]+' "$GITHUB_WORKSPACE/build.log" \
                               | awk '$2 != "-C" {print $2}' | tail -1)"
              if [ -n "$failed_target" ]; then
                retry_target "$failed_target"
              else
                echo "цель определить не удалось — полный build.log в артефакте"
              fi
            fi

            echo "===== диск и память ====="
            df -h / | tail -1
            free -m || true
            dmesg 2>/dev/null | grep -iE "out of memory|killed process" | tail -5 || true
          fi
          exit $rc

      # Проверка не только «файл существует», но и «образ работоспособен».
      - name: Verify image
        if: success()
        run: bash scripts/verify_image.sh "./$OPENWRT_DIR/bin/targets/$TARGET/$SUBTARGET"

      - name: Collect build info
        if: always()
        env:
          # без этого `ccache -s` читает ~/.ccache и всегда показывает ноль
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          {
            echo "commit          : $(git rev-parse HEAD)"
            echo "openwrt_tag     : ${{ steps.tag.outputs.value }}"
            echo "target          : $TARGET/$SUBTARGET"
            echo "jobs            : ${{ steps.jobs.outputs.value }}"
            echo "date_utc        : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "config_sha256   : $(sha256sum "$OPENWRT_DIR/.config" 2>/dev/null | cut -d' ' -f1)"
            for f in "$OPENWRT_DIR"/bin/targets/"$TARGET"/"$SUBTARGET"/*.img.gz; do
              [ -f "$f" ] || continue
              echo "image           : $(basename "$f") $(wc -c < "$f") байт"
              echo "image_sha256    : $(sha256sum "$f" | cut -d' ' -f1)"
            done
            echo
            echo "--- ccache ---"
            ccache -s 2>/dev/null || echo "ccache -s недоступен"
            echo
            echo "--- диск ---"
            df -h / | tail -1
            echo "--- память ---"
            free -m || true
          } > "$GITHUB_WORKSPACE/build-info.txt"
          cat "$GITHUB_WORKSPACE/build-info.txt"

      # actions/cache сохраняет кэш только при успешном прогоне (post-if: success()),
      # а мы отлаживаем именно падения: без этого шага каждая повторная сборка
      # начинается с нуля. Ключ уникален для прогона, restore-keys в шаге
      # «Restore ccache» находит самый свежий по префиксу.
      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ steps.tag.outputs.value }}-${{ github.run_id }}

      - name: Show failing logs
        if: failure()
        run: |
          echo "===== хвост build.log ====="
          tail -n 80 "$GITHUB_WORKSPACE/build.log" 2>/dev/null || echo "build.log нет"
          cd "$OPENWRT_DIR" || exit 0
          found=0
          for f in $(grep -rlE "Error [0-9]|error:" logs/ 2>/dev/null | head -5); do
            found=1
            echo "===== $f ====="
            tail -60 "$f"
          done
          if [ "$found" = "0" ]; then
            echo "логи с ошибками не найдены; список файлов:"
            find logs -name '*.txt' -size +0 2>/dev/null | head -20
          fi

      - name: Upload image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ steps.tag.outputs.value }}
          path: |
            ${{ env.OPENWRT_DIR }}/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.img.gz
            ${{ env.OPENWRT_DIR }}/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.manifest
            ${{ env.OPENWRT_DIR }}/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/profiles.json
            ${{ env.OPENWRT_DIR }}/.config
          if-no-files-found: error
          retention-days: 30
          # .config — скрытый файл; без этого флага upload-artifact его пропускает
          include-hidden-files: true

      # Логи нужны и при успехе: без базовой линии не с чем сравнивать,
      # а build.log — единственное место, куда ушёл весь вывод make world.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            build.log
            retry.log
            build-info.txt
            patch-status.txt
            ${{ env.OPENWRT_DIR }}/.config
            ${{ env.OPENWRT_DIR }}/logs/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

  # Шаг 03: загрузка собранного образа в QEMU (xilinx-zynq-a9) — ядро + DTB
  # платы + squashfs-корень + init. PL (радио, I2S) не эмулируется, проверяется
  # базовая система. Берёт артефакт шага 02, пересборки нет.
  qemu:
    name: 03 qemu smoke
    needs: build
    if: ${{ github.ref_type != 'tag' && inputs.release_run_id == '' && inputs.tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install QEMU and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm u-boot-tools mtools fdisk

      - name: Download image artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'sdcard-*' --dir artifacts
          find artifacts -type f -name '*.img.gz' -exec ls -l {} \;

      - name: Boot in QEMU
        env:
          QEMU_LOG: serial.log
        run: |
          img="$(find artifacts -type f -name '*.img.gz' | head -1)"
          if [ -z "$img" ]; then
            echo "ОШИБКА: в артефакте нет *.img.gz" >&2
            exit 1
          fi
          bash scripts/qemu_smoke.sh "$img" 180

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-serial-${{ github.run_id }}
          path: serial.log
          if-no-files-found: ignore
          retention-days: 7

  # Шаг 04 конвейера: публикация GitHub Release из уже собранного образа.
  # Сам ничего не собирает: находит зелёный прогон шагов 01–03 для коммита
  # тега, скачивает артефакт sdcard-*, считает SHA-256 и прикладывает файл.
  #
  #   git tag v1.1.0 && git push origin v1.1.0           — по тегу
  #   gh workflow run 01_build.yml -f tag=v1.1.0           — вручную
  #   gh workflow run 01_build.yml -f release_run_id=<id>    — из прогона
  release:
    name: 04 release
    # Зависимость выстроена для порядка: на прогоне ветки шаги 02–03 идут до
    # релиза, а на прогоне по тегу они пропущены — поэтому условие строится на
    # `!cancelled()`, а не на успехе соседей. Качество образа проверяет не эта
    # зависимость, а поиск зелёного прогона шагов 01–03 ниже: релиз публикует
    # только образ, прошедший проверку образа и QEMU в своём прогоне.
    needs: qemu
    if: ${{ !cancelled() && (github.ref_type == 'tag' || inputs.tag != '' || inputs.release_run_id != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # создание релиза и загрузка файла
      actions: read     # поиск прогона и скачивание артефакта
    env:
      BUILD_WORKFLOW: 01_build.yml
      ARTIFACT_PATTERN: sdcard-*

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # история нужна для списка изменений между тегами
          fetch-depth: 0

      - name: Resolve tag and commit
        id: tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          tag="$TAG_INPUT"
          if [ -z "$tag" ]; then
            if [ "$REF_TYPE" != "tag" ]; then
              echo "ОШИБКА: запуск не по тегу и tag не передан" >&2
              exit 1
            fi
            tag="$REF_NAME"
          fi
          case "$tag" in
            v*) ;;
            *) echo "ОШИБКА: тег должен начинаться с v, получено: $tag" >&2; exit 1 ;;
          esac
          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "ОШИБКА: тег $tag не существует" >&2
            exit 1
          fi
          sha="$(git rev-list -n1 "$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "релиз $tag → коммит $sha"

      # Релиз публикуется только из зелёного прогона шагов 01–03: иначе в релиз
      # попадёт образ, который не прошёл проверки образа и QEMU. Прогоны берём
      # только с артефактом sdcard-*: прогон по тегу (этот же workflow) образа
      # не собирал, а прошлые релизные прогоны — только публиковали его.
      - name: Find a green build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_INPUT: ${{ inputs.release_run_id }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          run_id="$RUN_INPUT"
          if [ -z "$run_id" ]; then
            candidates="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$BUILD_WORKFLOW" \
              --commit "$TAG_SHA" --limit 20 --json databaseId,conclusion \
              -q '.[] | select(.conclusion=="success") | .databaseId' 2>/dev/null || true)"
            for id in $candidates; do
              if [ "$id" = "$CURRENT_RUN" ]; then
                continue
              fi
              names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                -q '.artifacts[].name' 2>/dev/null || true)"
              if printf '%s\n' "$names" | grep -q '^sdcard-'; then
                run_id="$id"
                break
              fi
            done
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "ОШИБКА: для коммита $TAG_SHA нет успешного прогона с образом." >&2
            echo "Сначала соберите образ или передайте release_run_id." >&2
            exit 1
          fi
          conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)"
          head="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha -q .headSha)"
          if [ "$conclusion" != "success" ]; then
            echo "ОШИБКА: прогон $run_id не успешен ($conclusion)" >&2
            exit 1
          fi
          if [ -z "$RUN_INPUT" ] && [ "$head" != "$TAG_SHA" ]; then
            echo "ОШИБКА: прогон $run_id относится к коммиту $head, а не к тегу $TAG_SHA" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "используем прогон $run_id ($head)"

      - name: Download image
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          mkdir -p artifacts
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARTIFACT_PATTERN" --dir artifacts
          img="$(find artifacts -type f -name '*.img.gz' | head -1)"
          if [ -z "$img" ]; then
            echo "ОШИБКА: в артефакте нет *.img.gz" >&2
            find artifacts -type f | head -20 >&2
            exit 1
          fi
          echo "IMG=$img" >> "$GITHUB_ENV"
          sha256sum "$img" | tee artifacts/SHA256SUMS
          ls -l "$img"

      - name: Build release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          # Версия OpenWrt для заголовка — без ведущей «v»: .openwrt-version
          # хранит тег (v25.12.6), а в тексте нужно «25.12.6».
          openwrt="$(tr -d '[:space:]' < .openwrt-version 2>/dev/null || echo 'неизвестно')"
          openwrt="${openwrt#v}"
          size="$(wc -c < "$IMG" | tr -d ' ')"
          sha="$(cut -d' ' -f1 artifacts/SHA256SUMS)"
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            echo "## OPENWRT $openwrt"
            echo
            echo "Образ для Antminer S9 (Zynq-7010, XC7Z010), собран на OpenWrt **$openwrt**."
            echo "Номер релиза — версия образа этого проекта; версия OpenWrt — в заголовке."
            echo
            echo "| Параметр | Значение |"
            echo "|---|---|"
            echo "| OpenWrt | **$openwrt** |"
            echo "| Файл | \`$(basename "$IMG")\` |"
            echo "| Размер | $size байт |"
            echo "| SHA-256 | \`$sha\` |"
            echo "| Сборка | [прогон $RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID) |"
            echo "| Проверено | статические проверки образа + загрузка в QEMU |"
            echo
            if [ -n "$prev" ]; then
              echo "## Изменения с $prev"
              echo
              git log --oneline --no-merges "$prev..$TAG" | sed 's/^/- /'
            else
              echo "## Коммиты"
              echo
              git log --oneline --no-merges "$TAG" | head -50 | sed 's/^/- /'
            fi
            echo
            echo "## Установка"
            echo
            echo "Записать образ на microSD (Rufus, Win32 Disk Imager или \`dd\`),"
            echo "вставить в плату, перемычки JP1–JP4 = \`0 1 0 1\` (TF Card: JP2 = 1, JP4 = 1)."
            echo "Значение \`0 0 0 0\` — это Cascade JTAG, с ним плата с карты не загрузится. Подробности — \`BUILD.md\`."
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          exists="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
          pre=""
          case "$TAG" in
            *-*) pre="--prerelease" ;;
          esac
          if [ -n "$exists" ]; then
            if [ "$OVERWRITE" != "true" ]; then
              echo "ОШИБКА: релиз $TAG уже существует." >&2
              echo "Чтобы обновить файл и описание, запустите с overwrite=true." >&2
              exit 1
            fi
            gh release upload "$TAG" "$IMG" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" "$IMG" --title "$TAG" $pre \
              --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          fi
