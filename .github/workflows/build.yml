name: build image

on:
  workflow_dispatch:
    inputs:
      openwrt_tag:
        description: "Тег OpenWrt (пусто = значение из .openwrt-version)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "target-patches/**"
      - "configs/**"
      - "files/**"
      - "scripts/apply.sh"
      - ".github/workflows/build.yml"

concurrency:
  group: build-image
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve OpenWrt tag
        id: tag
        run: |
          tag="${{ inputs.openwrt_tag }}"
          if [ -z "$tag" ]; then
            tag="$(cat .openwrt-version 2>/dev/null || echo v25.12.6)"
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "Собираем OpenWrt: $tag"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h / | tail -1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file libelf-dev wget ca-certificates ccache

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 -b "${{ steps.tag.outputs.value }}" \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Apply patches and configure
        run: bash scripts/apply.sh ./openwrt

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ steps.tag.outputs.value }}-${{ hashFiles('configs/**', 'target-patches/**', 'packages/**') }}
          restore-keys: |
            ccache-${{ steps.tag.outputs.value }}-

      - name: Download sources
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cd openwrt
          make -j"$(nproc)" download

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cd openwrt
          make -j"$(nproc)" world

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: sdcard-${{ steps.tag.outputs.value }}
          path: |
            openwrt/bin/targets/zynq/generic/*.img.gz
            openwrt/bin/targets/zynq/generic/*.manifest
            openwrt/bin/targets/zynq/generic/profiles.json
            openwrt/.config
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            openwrt/logs/
          if-no-files-found: ignore
          retention-days: 7
