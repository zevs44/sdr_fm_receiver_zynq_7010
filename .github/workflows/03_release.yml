name: 03 release

# Публикует GitHub Release из уже собранного образа.
# Релиз не собирает образ заново: он берёт артефакт зелёного прогона
# «01 build image» для коммита тега и прикладывает его к релизу.
#
# Запуск:
#   git tag v25.12.6 && git push origin v25.12.6     — по тегу
#   gh workflow run 03_release.yml -f tag=v25.12.6   — вручную
#   gh workflow run 03_release.yml -f run_id=<id>    — из конкретного прогона

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v25.12.6); пусто = тег из push"
        required: false
        default: ""
      run_id:
        description: "ID зелёного прогона 01 build image (пусто = найти по коммиту тега)"
        required: false
        default: ""
      overwrite:
        description: "Обновить существующий релиз (перезалить файл и описание)"
        type: boolean
        default: false

permissions:
  contents: write   # создание релиза и загрузка файла
  actions: read     # поиск прогона и скачивание артефакта

env:
  BUILD_WORKFLOW: 01_build.yml
  ARTIFACT_PATTERN: sdcard-*

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # история нужна для списка изменений между тегами
          fetch-depth: 0

      - name: Resolve tag and commit
        id: tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          tag="$TAG_INPUT"
          if [ -z "$tag" ]; then
            if [ "$REF_TYPE" != "tag" ]; then
              echo "ОШИБКА: запуск не по тегу и tag не передан" >&2
              exit 1
            fi
            tag="$REF_NAME"
          fi
          case "$tag" in
            v*) ;;
            *) echo "ОШИБКА: тег должен начинаться с v, получено: $tag" >&2; exit 1 ;;
          esac
          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "ОШИБКА: тег $tag не существует" >&2
            exit 1
          fi
          sha="$(git rev-list -n1 "$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "релиз $tag → коммит $sha"

      # Релиз публикуется только из зелёного прогона: иначе в релиз попадёт
      # образ, который не прошёл проверки образа и QEMU.
      - name: Find a green build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_INPUT: ${{ inputs.run_id }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          run_id="$RUN_INPUT"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$BUILD_WORKFLOW" \
              --commit "$TAG_SHA" --limit 20 --json databaseId,conclusion \
              -q '[.[] | select(.conclusion=="success")][0].databaseId' 2>/dev/null || true)"
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "ОШИБКА: для коммита $TAG_SHA нет успешного прогона $BUILD_WORKFLOW." >&2
            echo "Сначала соберите образ или передайте run_id." >&2
            exit 1
          fi
          conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)"
          head="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha -q .headSha)"
          if [ "$conclusion" != "success" ]; then
            echo "ОШИБКА: прогон $run_id не успешен ($conclusion)" >&2
            exit 1
          fi
          if [ -z "$RUN_INPUT" ] && [ "$head" != "$TAG_SHA" ]; then
            echo "ОШИБКА: прогон $run_id относится к коммиту $head, а не к тегу $TAG_SHA" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "используем прогон $run_id ($head)"

      - name: Download image
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          mkdir -p artifacts
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARTIFACT_PATTERN" --dir artifacts
          img="$(find artifacts -type f -name '*.img.gz' | head -1)"
          if [ -z "$img" ]; then
            echo "ОШИБКА: в артефакте нет *.img.gz" >&2
            find artifacts -type f | head -20 >&2
            exit 1
          fi
          echo "IMG=$img" >> "$GITHUB_ENV"
          sha256sum "$img" | tee artifacts/SHA256SUMS
          ls -l "$img"

      - name: Build release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          openwrt="$(tr -d '[:space:]' < .openwrt-version 2>/dev/null || echo 'неизвестно')"
          size="$(wc -c < "$IMG" | tr -d ' ')"
          sha="$(cut -d' ' -f1 artifacts/SHA256SUMS)"
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            echo "Образ OpenWrt **$openwrt** для Antminer S9 (Zynq-7010, XC7Z010)."
            echo
            echo "| Параметр | Значение |"
            echo "|---|---|"
            echo "| Файл | \`$(basename "$IMG")\` |"
            echo "| Размер | $size байт |"
            echo "| SHA-256 | \`$sha\` |"
            echo "| Сборка | [прогон $RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID) |"
            echo "| Проверено | статические проверки образа + загрузка в QEMU |"
            echo
            if [ -n "$prev" ]; then
              echo "## Изменения с $prev"
              echo
              git log --oneline --no-merges "$prev..$TAG" | sed 's/^/- /'
            else
              echo "## Коммиты"
              echo
              git log --oneline --no-merges "$TAG" | head -50 | sed 's/^/- /'
            fi
            echo
            echo "## Установка"
            echo
            echo "Записать образ на microSD (Rufus, Win32 Disk Imager или \`dd\`),"
            echo "вставить в плату, JP1–JP4 = \`0 0 0 0\`. Подробности — \`BUILD.md\`."
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          exists="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
          pre=""
          case "$TAG" in
            *-*) pre="--prerelease" ;;
          esac
          if [ -n "$exists" ]; then
            if [ "$OVERWRITE" != "true" ]; then
              echo "ОШИБКА: релиз $TAG уже существует." >&2
              echo "Чтобы обновить файл и описание, запустите с overwrite=true." >&2
              exit 1
            fi
            gh release upload "$TAG" "$IMG" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" "$IMG" --title "$TAG" $pre \
              --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          fi
