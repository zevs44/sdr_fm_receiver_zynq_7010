name: 03 qemu smoke

# Загружает уже собранный образ в QEMU (xilinx-zynq-a9) и проверяет, что
# ядро стартует на DTB платы, монтирует squashfs-корень и доходит до init.
# PL (радио, I2S) QEMU не эмулирует — это проверка базовой системы.
#
# Запуск вручную; по умолчанию берётся последний успешный прогон
# «01 build image». Пересборка не нужна — только скачивание артефакта.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID прогона сборки (пусто = последний успешный 01 build image)"
        required: false
        default: ""
      timeout_seconds:
        description: "Сколько ждать загрузки, секунд"
        required: false
        default: "180"

permissions:
  contents: read
  actions: read

jobs:
  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install QEMU and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm u-boot-tools mtools fdisk
          qemu-system-arm --version | head -1
          dumpimage --version | head -1

      - name: Resolve build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          run_id="$INPUT_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
                        --workflow 01_build.yml --status success --limit 1 \
                        --json databaseId -q '.[0].databaseId')"
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "ОШИБКА: не найден успешный прогон сборки" >&2
            exit 1
          fi
          echo "value=$run_id" >> "$GITHUB_OUTPUT"
          echo "прогон сборки: $run_id"

      - name: Download image artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh run download "${{ steps.run.outputs.value }}" \
            --repo "$GITHUB_REPOSITORY" --pattern 'sdcard-*' --dir artifacts
          find artifacts -type f -name '*.img.gz' -exec ls -l {} \;

      - name: Boot in QEMU
        env:
          QEMU_LOG: serial.log
        run: |
          img="$(find artifacts -type f -name '*.img.gz' | head -1)"
          if [ -z "$img" ]; then
            echo "ОШИБКА: в артефакте нет *.img.gz" >&2
            exit 1
          fi
          bash scripts/qemu_smoke.sh "$img" "${{ inputs.timeout_seconds }}"

      - name: Collect serial log
        if: always()
        run: ls -l serial.log 2>/dev/null || true

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-serial-${{ github.run_id }}
          path: serial.log
          if-no-files-found: ignore
          retention-days: 7
