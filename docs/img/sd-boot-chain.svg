<svg viewBox="0 0 900 245" role="img" aria-label="Схема загрузки битстрима с SD-карты"><rect width="100%" height="100%" fill="#0f1419"/>
  <rect x="20" y="34" width="210" height="160" rx="10" fill="#16202a" stroke="#61afef" stroke-width="2"/>
  <text x="125" y="58" fill="#61afef" font-size="13" text-anchor="middle">SD · раздел 1 (FAT)</text>
  <text x="42" y="86" fill="#d8dee9" font-size="12">BOOT.BIN</text>
  <text x="42" y="106" fill="#d8dee9" font-size="12">uEnv.txt</text>
  <text x="42" y="126" fill="#e5c07b" font-size="12" font-weight="700">system.bit.gz ← заменяем</text>
  <text x="42" y="146" fill="#d8dee9" font-size="12">fit.itb</text>
  <text x="42" y="172" fill="#8a94a3" font-size="11">16 МБ, MBR LBA 0x8028</text>

  <rect x="280" y="34" width="150" height="60" rx="8" fill="#1a2028" stroke="#33404d"/>
  <text x="355" y="60" fill="#d8dee9" font-size="13" text-anchor="middle">U-Boot (SPL)</text>
  <text x="355" y="78" fill="#8a94a3" font-size="11" text-anchor="middle">читает uEnv.txt</text>

  <rect x="480" y="34" width="170" height="60" rx="8" fill="#1a2028" stroke="#33404d"/>
  <text x="565" y="54" fill="#d8dee9" font-size="12" text-anchor="middle">unzip → 0x3000000</text>
  <text x="565" y="72" fill="#d8dee9" font-size="12" text-anchor="middle">fpga loadb 0 …</text>
  <text x="565" y="88" fill="#8a94a3" font-size="10" text-anchor="middle">запись конфигурации PL</text>

  <rect x="700" y="34" width="180" height="60" rx="8" fill="#16221f" stroke="#56b6c2"/>
  <text x="790" y="60" fill="#56b6c2" font-size="13" text-anchor="middle">ПЛИС работает</text>
  <text x="790" y="78" fill="#8a94a3" font-size="11" text-anchor="middle">I2S на J1 активен</text>

  <line x1="230" y1="64" x2="276" y2="64" stroke="#8a94a3" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="430" y1="64" x2="476" y2="64" stroke="#8a94a3" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="650" y1="64" x2="696" y2="64" stroke="#56b6c2" stroke-width="2" marker-end="url(#arg)"/>

  <rect x="280" y="134" width="600" height="56" rx="8" fill="#1a2028" stroke="#33404d"/>
  <text x="580" y="156" fill="#d8dee9" font-size="12" text-anchor="middle">далее: load mmc 0 0x4000000 fit.itb ; bootm 0x4000000 → ядро + devicetree + rootfs</text>
  <text x="580" y="176" fill="#8a94a3" font-size="11" text-anchor="middle">JTAG в этой схеме не участвует ни на одном шаге</text>
</svg>