<svg viewBox="0 0 1000 640" width="1000" role="img" aria-label="Полная карта аудиопотоков Antminer S9 Zynq-7010" xmlns="http://www.w3.org/2000/svg" height="640"><rect x="0" y="0" width="1000" height="640" fill="#0f1419"/>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a94a3"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e06c75"/></marker>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#56b6c2"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#61afef"/></marker>
  </defs>
  <style>
    .src{fill:#222b35;stroke:#61afef;stroke-width:1.5}
    .blk{fill:#1a2028;stroke:#33404d;stroke-width:1.5}
    .out{fill:#173030;stroke:#56b6c2;stroke-width:1.8}
    .t{fill:#d8dee9;font:13px sans-serif;text-anchor:middle}
    .s{fill:#8a94a3;font:11px sans-serif;text-anchor:middle}
    .l{fill:#8a94a3;font:10.5px sans-serif;text-anchor:middle}
  </style>

  <!-- источники -->
  <rect class="src" x="20" y="30" width="150" height="55" rx="8"/>
  <text class="t" x="95" y="52">RF-антенна</text>
  <text class="s" x="95" y="70">J5 · V15/W15 · LVDS</text>

  <rect class="src" x="20" y="280" width="150" height="65" rx="8"/>
  <text class="t" x="95" y="303">myMPD / интернет</text>
  <text class="s" x="95" y="321">ALSA hw:0,0</text>
  <text class="s" x="95" y="336">PS DMA → PL</text>

  <rect class="src" x="20" y="470" width="150" height="55" rx="8"/>
  <text class="t" x="95" y="492">Bluetooth (J9)</text>
  <text class="s" x="95" y="510">T17/R18/R17 · ВХОД</text>

  <!-- RF-тракт -->
  <rect class="blk" x="210" y="20" width="180" height="55" rx="8"/>
  <text class="t" x="300" y="42">axi_sdr_fm</text>
  <text class="s" x="300" y="60">FM-демод + RDS</text>

  <rect class="blk" x="210" y="95" width="180" height="38" rx="8"/>
  <text class="t" x="300" y="118">audio_resampler · 48 кГц</text>

  <rect class="blk" x="210" y="155" width="180" height="38" rx="8"/>
  <text class="t" x="300" y="178">fm_ds_dac</text>

  <rect class="blk" x="450" y="95" width="130" height="38" rx="8"/>
  <text class="t" x="515" y="118">i2s_tx</text>

  <!-- myMPD / ADI -->
  <rect class="blk" x="210" y="280" width="180" height="65" rx="8"/>
  <text class="t" x="300" y="303">axi_i2s_adi TX</text>
  <text class="s" x="300" y="321">ALSA hw:0,0 · PS DMA</text>
  <text class="s" x="300" y="336">bclk_o / lrclk_o / sdata_o</text>

  <!-- мультиплексор -->
  <rect class="blk" x="620" y="180" width="160" height="230" rx="10"/>
  <text class="t" x="700" y="205">Мультиплексор</text>
  <text class="s" x="700" y="223">i2s_axi_mux</text>
  <text class="s" x="700" y="239">0x43C8_0000</text>
  <text class="s" x="700" y="264" style="fill:#e06c75">ch0 = RF</text>
  <text class="s" x="700" y="302" style="fill:#61afef">ch1 = myMPD</text>
  <text class="s" x="700" y="340" style="fill:#56b6c2">ch2 = Bluetooth</text>
  <text class="s" x="700" y="378">селект 0 / 1 / 2</text>

  <!-- ΔΣ -->
  <rect class="blk" x="820" y="250" width="150" height="60" rx="8"/>
  <text class="t" x="895" y="273">ΔΣ-ЦАП</text>
  <text class="s" x="895" y="291">i2s_to_delta_sigma_d</text>

  <!-- выходы -->
  <rect class="out" x="820" y="150" width="150" height="50" rx="8"/>
  <text class="t" x="895" y="171" style="fill:#56b6c2">J4 · audio_out</text>
  <text class="s" x="895" y="189">Y14/W14 · PDM</text>

  <rect class="out" x="820" y="330" width="150" height="50" rx="8"/>
  <text class="t" x="895" y="351" style="fill:#56b6c2">J2 · dac_out</text>
  <text class="s" x="895" y="369">W13/V12 · PDM</text>

  <rect class="out" x="820" y="480" width="150" height="50" rx="8"/>
  <text class="t" x="895" y="501" style="fill:#56b6c2">T16 · antenna_out</text>
  <text class="s" x="895" y="519">FM-передача</text>

  <rect class="blk" x="450" y="480" width="160" height="45" rx="8"/>
  <text class="t" x="530" y="500">fm_transmitter</text>
  <text class="s" x="530" y="516">0x43C90000</text>

  <!-- стрелки: RF -->
  <path d="M170,57 L210,47" fill="none" stroke="#e06c75" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M300,75 L300,95" fill="none" stroke="#8a94a3" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M300,133 L300,155" fill="none" stroke="#8a94a3" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M390,174 L820,174" fill="none" stroke="#56b6c2" stroke-width="2" marker-end="url(#ac)"/>
  <text class="l" x="600" y="166">только FM, всегда</text>
  <path d="M390,114 L450,114" fill="none" stroke="#8a94a3" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M580,114 C600,114 600,220 620,220" fill="none" stroke="#e06c75" stroke-width="2" marker-end="url(#ar)"/>
  <text class="l" x="592" y="150" style="fill:#e06c75">ch0</text>

  <!-- стрелки: myMPD -->
  <path d="M170,312 L210,312" fill="none" stroke="#61afef" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M390,300 L620,300" fill="none" stroke="#61afef" stroke-width="2" marker-end="url(#ab)"/>
  <text class="l" x="500" y="292" style="fill:#61afef">ch1</text>
  <path d="M390,340 C420,340 420,502 450,502" fill="none" stroke="#61afef" stroke-width="2" marker-end="url(#ab)"/>
  <text class="l" x="360" y="470" style="fill:#61afef">мимо мюкса</text>
  <path d="M610,502 L820,502" fill="none" stroke="#56b6c2" stroke-width="2" marker-end="url(#ac)"/>

  <!-- стрелки: Bluetooth -->
  <path d="M170,497 C300,497 400,470 620,380" fill="none" stroke="#56b6c2" stroke-width="2" marker-end="url(#ac)"/>
  <text class="l" x="420" y="430" style="fill:#56b6c2">ch2</text>

  <!-- выход мюкса -->
  <path d="M780,280 L820,280" fill="none" stroke="#56b6c2" stroke-width="2" marker-end="url(#ac)"/>
  <text class="l" x="800" y="270">выход мюкса</text>
  <path d="M895,310 L895,330" fill="none" stroke="#56b6c2" stroke-width="2" marker-end="url(#ac)"/>
  <text class="l" x="895" y="395">один из трёх</text>

  <!-- запрет -->
  <rect x="620" y="560" width="350" height="55" rx="8" fill="#3a1f23" stroke="#e06c75" stroke-width="1.5"/>
  <text x="795" y="583" fill="#e06c75" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Выходного I2S (BCK/LRCK/DIN) на пинах НЕТ</text>
  <text x="795" y="601" fill="#8a94a3" font-family="sans-serif" font-size="11" text-anchor="middle">PCM5102 — только после пересборки битстрима</text>

  <!-- легенда -->
  <text class="l" x="120" y="600" style="fill:#e06c75">— RF-тракт</text>
  <text class="l" x="120" y="618" style="fill:#61afef">— myMPD-тракт</text>
  <text class="l" x="285" y="600" style="fill:#56b6c2">— Bluetooth / выход</text>
  <text class="l" x="285" y="618" style="fill:#8a94a3">— внутренняя логика</text>
</svg>