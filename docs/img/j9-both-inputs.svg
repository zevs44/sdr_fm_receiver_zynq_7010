<svg viewBox="0 0 620 190" width="620" role="img" aria-label="Оба конца — входы" xmlns="http://www.w3.org/2000/svg" height="190"><rect x="0" y="0" width="620" height="190" fill="#0f1419"/>
  <defs><marker id="ah3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e06c75"/></marker></defs>
  <style>.bb{fill:#222b35;stroke:#61afef;stroke-width:1.5}.tt{fill:#d8dee9;font:13px sans-serif;text-anchor:middle}</style>
  <rect class="bb" x="20" y="60" width="170" height="80" rx="8"/>
  <text class="tt" x="105" y="85">FPGA (порт J9)</text>
  <text class="tt" x="105" y="108" style="fill:#e06c75">DIN  BCK  LRCK</text>
  <text class="tt" x="105" y="128" style="fill:#e06c75">← входы</text>
  <rect class="bb" x="430" y="60" width="170" height="80" rx="8"/>
  <text class="tt" x="515" y="85">PCM5102 (ЦАП)</text>
  <text class="tt" x="515" y="108" style="fill:#e06c75">DIN  BCK  LRCK</text>
  <text class="tt" x="515" y="128" style="fill:#e06c75">← входы</text>
  <path d="M190,85 L430,85 M190,100 L430,100 M190,115 L430,115" stroke="#e06c75" stroke-width="2"/>
  <text x="310" y="45" fill="#e06c75" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">оба конца — входы ✕</text>
  <text x="310" y="172" fill="#8a94a3" font-family="sans-serif" font-size="12" text-anchor="middle">Никто не «говорит»: FPGA принимает I2S, PCM5102 тоже принимает I2S. Нужен выход BCK/LRCK/DIN.</text>
</svg>